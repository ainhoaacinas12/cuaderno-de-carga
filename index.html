<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuaderno de Carga</title>
<meta name="description" content="Registro personal de entrenamientos de fuerza">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: app de una pantalla — cabecera por pestaña, contenido con scroll, barra de descanso y pestañas abajo, todo al alcance del pulgar */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EBEEF3; --line:#DCE1E8;
  --fg:#141820; --muted:#667080;
  --accent:#2F6FEB; --accent-fg:#FFFFFF; --accent-soft:#E2EBFD;
  --ok:#1F8F55; --ok-soft:#DDF2E6; --gold:#B57A07; --gold-soft:#FBEFD3;
  --danger:#D13F3F; --danger-soft:#FBE4E4; --fig:#D3D9E2; --shadow:0 1px 2px rgba(20,24,32,.06),0 4px 16px rgba(20,24,32,.06);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#1A1F26; --surface-2:#232A33; --line:#2D3540;
  --fg:#ECEFF4; --muted:#98A2AF;
  --accent:#4A86F5; --accent-fg:#FFFFFF; --accent-soft:#1B2B48;
  --ok:#3CC07B; --ok-soft:#163626; --gold:#F2B544; --gold-soft:#3A2D12;
  --danger:#EF6464; --danger-soft:#3D1D1D; --fig:#333C48; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#1A1F26; --surface-2:#232A33; --line:#2D3540;
  --fg:#ECEFF4; --muted:#98A2AF;
  --accent:#4A86F5; --accent-fg:#FFFFFF; --accent-soft:#1B2B48;
  --ok:#3CC07B; --ok-soft:#163626; --gold:#F2B544; --gold-soft:#3A2D12;
  --danger:#EF6464; --danger-soft:#3D1D1D; --fig:#333C48; --shadow:none; color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;position:relative}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;min-height:64px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;min-width:0;text-wrap:balance;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--fg);transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.big{min-height:56px;font-size:17px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);flex:none}
.link{color:var(--accent);font-weight:600;min-height:44px;padding:0 4px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:16px;height:44px}
input,textarea{-webkit-user-select:text;user-select:text}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
textarea.field{min-height:80px;resize:vertical}
.flabel{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;display:block}
/* biblioteca */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.excard-s{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.excard-s .fig{height:92px;display:flex;justify-content:center;background:var(--surface-2);border-radius:10px;padding:6px 0}
.excard-s .fig svg{height:100%;width:auto}
.excard-s .nm{font-weight:600;font-size:14px;line-height:1.25}
.excard-s .mt{font-size:12px;color:var(--muted)}
.excard-s .star{position:absolute;top:16px;right:16px;color:var(--gold)}
.excard-s.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.excard-s .tick{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent}
.excard-s.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.excard-s .tick svg{width:16px;height:16px;stroke-width:3}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}
/* figura */
.body-fig .p{fill:var(--fig)}
.body-fig .p.hl{fill:var(--accent)}
.body-fig .p.soft{fill:var(--accent-soft)}
/* rutinas */
.rcard h2{font-size:18px}
.days-mini{display:flex;gap:3px}
.days-mini span{width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.days-mini span.on{background:var(--accent-soft);color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.days button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.edlist{display:flex;flex-direction:column;gap:8px}
.ed-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:transform .18s ease}
.ed-item.dragging{transition:none;z-index:3;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);border-color:var(--accent)}
.ed-row{display:flex;align-items:center;gap:4px;min-height:60px;padding-right:12px}
.handle{width:44px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab}
.ed-main{flex:1;min-width:0;text-align:left;padding:10px 0;display:flex;flex-direction:column;gap:2px}
.ed-main .name{font-weight:600}
.ed-main .sum{font-size:13px;color:var(--muted)}
.ed-body{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.stp{display:flex;align-items:center;gap:10px}
.stp .lb{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.stp .ctl{display:flex;align-items:center;gap:6px}
.stp .ctl button{width:44px;height:40px;border-radius:10px;background:var(--surface-2);font-size:20px;font-weight:500}
.stp .ctl .v{min-width:64px;text-align:center;font-weight:700;font-size:17px}
.stp .ctl input{width:72px;text-align:center;font-weight:700;font-size:17px;border:1px solid var(--line);border-radius:10px;height:40px;background:var(--surface);outline:none}
.rest-chips{display:flex;gap:6px;flex-wrap:wrap}
/* entrenar */
.today{display:flex;flex-direction:column;gap:12px}
.today .exlist{font-size:14px;color:var(--muted);line-height:1.5}
.listrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 16px}
.listrow .t{font-weight:600}
.listrow .s{font-size:13px;color:var(--muted)}
.elapsed{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pager{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pg{flex:none;max-width:170px;min-height:40px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:13px;line-height:1.2}
.pg b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg span{color:var(--muted);font-size:12px}
.pg.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.pg.done span{color:var(--ok);font-weight:600}
.exhead{display:flex;gap:12px;align-items:center}
.exhead .fig{width:52px;height:72px;flex:none;background:var(--surface-2);border-radius:10px;display:flex;justify-content:center;padding:4px 0}
.exhead .fig svg{height:100%;width:auto}
.exhead h2{font-size:20px;line-height:1.2}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,1.15fr) minmax(0,.85fr) 54px;gap:6px;align-items:center}
.srow.r1{grid-template-columns:38px minmax(0,1fr) minmax(0,2fr) 54px}
.srow.hd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.srow .lbl{height:48px;border-radius:10px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.srow .lbl.c{background:var(--gold-soft);color:var(--gold)}
.srow .prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.srow .val{height:48px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.srow .val small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.srow .ok{width:54px;height:48px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.srow .ok svg{width:26px;height:26px;stroke-width:2.6}
.srow.done .ok{background:var(--ok);color:#fff}
.srow.done .val{background:var(--ok-soft);border-color:transparent}
.srow.pr .val{box-shadow:0 0 0 2px var(--gold) inset}
.setops{display:flex;gap:8px;margin-top:10px}
.setops .btn{flex:1}
.exnav{display:flex;align-items:center;gap:8px;margin-top:12px}
.exnav .btn{flex:1}
.exnav .pos{min-width:56px;text-align:center;color:var(--muted);font-weight:600}
.rest{flex:none;background:var(--surface);border-top:1px solid var(--line);position:relative;overflow:hidden}
.rest .bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:calc(var(--p,0) * 100%);transition:width .25s linear}
.rest-in{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rest .tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:1;min-width:0}
.rest .btn{min-height:44px;padding:0 12px}
.rest.over .tm{color:var(--ok)}
/* tabs */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--accent)}
nav.tabs .play{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
nav.tabs .play svg{width:16px;height:16px;fill:currentColor;stroke:none}
nav.tabs .live{background:var(--ok)}
/* historial */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:16px 0 12px}
.seg button{min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums;font-size:14px}
.cal .d.out{visibility:hidden}
.cal .d.has{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cal .d.today{box-shadow:0 0 0 1.5px var(--fg) inset}
.cal .d.sel{background:var(--accent);color:var(--accent-fg)}
.cal .d i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{flex:1;font-size:17px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .end{fill:var(--accent)}
.chart .endl{fill:var(--fg);font-weight:700;font-size:11px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rec .s{font-size:12px;color:var(--muted)}
.sesline{font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
.sesline b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
/* hoja inferior */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease}
.sheet.full{height:92%;max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.sheet.full .sheet-scroll{flex:1;min-height:0;overflow-y:auto;margin-inline:-4px;padding-inline:4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{flex:1;min-width:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.big-ed{display:flex;flex-direction:column;gap:14px;margin:6px 0 14px}
.big-ed .blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.big-ed .blk .lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.big-ed .ctl{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center}
.big-ed .ctl button{height:60px;border-radius:12px;background:var(--surface-2);font-size:28px;font-weight:500}
.big-ed .ctl input{height:60px;width:100%;min-width:0;text-align:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button{min-height:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.feel button b{font-size:20px}
.feel button span{font-size:10px;color:var(--muted)}
.feel button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.feel button.on span{color:var(--accent-fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.gold{background:var(--gold);color:#1a1300}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.sync.on i{background:var(--ok)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.divider{height:1px;background:var(--line);margin:16px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <div id="rest" class="rest" hidden></div>

</div>

function normState(d) { d = d || {}; return {v: 1, rutinas: Array.isArray(d.rutinas) ? d.rutinas : [], custom: Array.isArray(d.custom) ? d.custom : [], favs: Array.isArray(d.favs) ? d.favs : [], lastBackup: d.lastBackup || null}; }

const chains = {};
function enqueue(key, fn) {
  chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(err => { console.warn('Guardado', key, err); if (err && err.code === 'quota_exceeded') toast('Se ha llenado el espacio de guardado. Exporta una copia y borra sesiones antiguas.'); });
  return chains[key];
}
const timers = {};
function debounce(key, ms, fn) { clearTimeout(timers[key]); timers[key] = setTimeout(fn, ms); }
function saveState() { lsSave(); if (cloud.ok) debounce('state', 400, () => enqueue('state', () => cloud.stateRef.set(clone(S)))); }
function saveActive(now) {
  lsSave();
  if (!cloud.ok) return;
  const run = () => enqueue('act', () => ACT ? cloud.actRef.set({ses: clone(ACT)}) : cloud.actRef.delete());
  if (now) { clearTimeout(timers.act); run(); } else debounce('act', 700, run);
}
function saveSession(s) { lsSave(); if (cloud.ok) enqueue('s:' + s.id, () => cloud.sesCol.doc(s.id).set(clone(s))); }
function deleteSessionRemote(id) { lsSave(); if (cloud.ok) enqueue('s:' + id, () => cloud.sesCol.doc(id).delete()); }

async function connect() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    window.claude.use('downloads').then(d => { cloud.downloads = d; }).catch(() => {});
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    const base = 'data/users/' + uid;
    cloud.stateRef = db.doc(base + '/state');
    cloud.actRef = db.doc(base + '/active');
    cloud.sesCol = cloud.stateRef.collection('sessions');
    const [st, ac, ss] = await Promise.all([cloud.stateRef.get(), cloud.actRef.get(), cloud.sesCol.limit(1000).get()]);
    cloud.ok = true;
    const localHas = S.rutinas.length || S.custom.length || S.favs.length;
    if (st.exists) S = normState(clone(st.data()));
    else if (localHas) await cloud.stateRef.set(clone(S));
    const byId = new Map(ss.docs.map(d => { const v = clone(d.data()); return [v.id || d.id, v]; }));
    for (const s of SES) if (!byId.has(s.id)) { byId.set(s.id, s); saveSession(s); }
    SES = [...byId.values()].sort((a, b) => b.inicio - a.inicio);
    if (ac.exists && ac.data().ses) ACT = clone(ac.data().ses);
    else if (ACT) saveActive(true);
    lsSave();
  } catch (e) { console.warn('Sin guardado en la nube', e); cloud.ok = false; }
  finally { cloud.tried = true; render(); }
}

/* ---------- cálculos ---------- */
const e1 = st => (st.kg > 0 && st.reps > 0) ? (st.reps === 1 ? st.kg : st.kg * (1 + st.reps / 30)) : 0;
const volSets = sets => sets.reduce((a, st) => a + (st.tipo !== 'C' && st.kg > 0 && st.reps > 0 ? st.kg * st.reps : 0), 0);
const sesVol = s => s.ejercicios.reduce((a, e) => a + volSets(e.sets.filter(x => x.done !== false)), 0);
const sesSets = s => s.ejercicios.reduce((a, e) => a + e.sets.filter(x => x.done !== false).length, 0);
function lastFor(ejId, skipId) { for (const s of SES) { if (s.id === skipId) continue; for (const e of s.ejercicios) if (e.ejId === ejId) return e; } return null; }
function bestFor(ejId, skipId) {
  const b = {kg: 0, kgReps: 0, e1: 0, reps: 0, seg: 0, n: 0, last: null, date: null};
  for (const s of SES) {
    if (s.id === skipId) continue;
    let used = false;
    for (const e of s.ejercicios) {
      if (e.ejId !== ejId) continue;
      used = true;
      for (const st of e.sets) {
        if (st.tipo === 'C') continue;
        if ((st.kg || 0) > b.kg || ((st.kg || 0) === b.kg && (st.reps || 0) > b.kgReps)) { b.kg = st.kg || 0; b.kgReps = st.reps || 0; b.date = s.inicio; }
        b.e1 = Math.max(b.e1, e1(st)); b.reps = Math.max(b.reps, st.reps || 0); b.seg = Math.max(b.seg, st.seg || 0);
      }
    }
    if (used) { b.n++; if (!b.last || s.inicio > b.last) b.last = s.inicio; }
  }
  return b;
}
function seriesFor(ejId, metric) {
  const out = [];
  for (const s of SES) for (const e of s.ejercicios) {
    if (e.ejId !== ejId) continue;
    const ef = e.sets.filter(x => x.tipo !== 'C');
    if (!ef.length) continue;
    let y = 0;
    if (metric === 'kg') y = Math.max(...ef.map(x => x.kg || 0));
    else if (metric === 'e1') y = Math.max(...ef.map(e1));
    else if (metric === 'vol') y = volSets(ef);
    else if (metric === 'reps') y = Math.max(...ef.map(x => x.reps || 0));
    else if (metric === 'seg') y = Math.max(...ef.map(x => x.seg || 0));
    out.push({x: s.inicio, y: r2(y)});
  }
  return out.sort((a, b) => a.x - b.x);
}
function weekKey(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (isoDow(t) - 1)); return dayKey(d.getTime()); }
function streak() {
  const weeks = new Set(SES.map(s => weekKey(s.inicio)));
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - (isoDow(d.getTime()) - 1));
  let n = 0;
  if (!weeks.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 7);
  while (weeks.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
const metricLabel = {e1: '1RM estimado (kg)', kg: 'Peso máximo (kg)', vol: 'Volumen (kg)', reps: 'Repeticiones máx.', seg: 'Tiempo máx. (s)'};

/* ---------- gráfica ---------- */
function chartSVG(pts, opts = {}) {
  const W = 340, H = opts.h || 190, L = 40, R = 16, T = 18, B = 24;
  if (pts.length === 0) return '';
  let ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi = hi + pad;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  const X = x => pts.length === 1 ? (L + W - R) / 2 : L + (x - x0) / (x1 - x0 || 1) * (W - L - R);
  const Y = y => T + (1 - (y - lo) / (hi - lo || 1)) * (H - T - B);
  let g = '';
  const nT = Math.round((hi - lo) / step);
  for (let k = 0; k <= nT; k++) { const v = r2(lo + k * step); g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v >= 1000 ? nf0.format(v) : kgf(v)}</text>`; }
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = pts.length > 1 ? `${line} L${X(x1).toFixed(1)} ${Y(lo)} L${X(x0).toFixed(1)} ${Y(lo)} Z` : '';
  const last = pts[pts.length - 1];
  const dots = pts.length <= 40 ? pts.slice(0, -1).map(p => `<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6"/>`).join('') : '';
  const lx = X(last.x), anchor = lx > W - 60 ? 'end' : 'middle';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Progresión')}">${g}
    ${area ? `<path class="ar" d="${area}"/>` : ''}<path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${lx}" cy="${Y(last.y)}" r="4.5"/><text class="endl" x="${lx}" y="${Y(last.y) - 9}" text-anchor="${anchor}">${kgf(last.y)}</text>
    <text x="${L}" y="${H - 6}">${fmtDate(x0)}</text>${pts.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>` : ''}</svg>`;
}
function niceStep(raw) { if (!(raw > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function initDrag() {
  const list = document.getElementById('edlist'); if (!list) return;
  list.querySelectorAll('.handle').forEach(h => h.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    const item = h.closest('.ed-item'), items = [...list.children], from = items.indexOf(item);
    const rects = items.map(x => x.getBoundingClientRect());
    const gap = items.length > 1 ? rects[1].top - rects[0].bottom : 8;
    const startY = ev.clientY; let to = from;
    item.classList.add('dragging');
    try { h.setPointerCapture(ev.pointerId); } catch (e) {}
    const move = m => {
      const dy = m.clientY - startY; item.style.transform = `translateY(${dy}px)`;
      const c = rects[from].top + rects[from].height / 2 + dy; to = from;
      for (let i = 0; i < from; i++) if (c < rects[i].top + rects[i].height / 2) { to = i; break; }
      if (to === from) for (let i = rects.length - 1; i > from; i--) if (c > rects[i].top + rects[i].height / 2) { to = i; break; }
      const sh = rects[from].height + gap;
      items.forEach((it, i) => { if (it === item) return; let s = 0; if (from < to && i > from && i <= to) s = -sh; if (from > to && i >= to && i < from) s = sh; it.style.transform = s ? `translateY(${s}px)` : ''; });
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      if (to !== from) { const arr = ui.ed.ejercicios; const [m] = arr.splice(from, 1); arr.splice(to, 0, m); if (ui.ed.open === from) ui.ed.open = to; else ui.ed.open = null; }
      render();
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }));
}

}

      ${pts.length ? chartSVG(pts, {label: x.nombre}) : `<p class="muted" style="padding:20px 8px">Sin datos en este periodo.</p>`}</div>
    ${pts.length ? `<h3>Sesiones</h3><div class="card" style="padding:4px 16px">${pts.slice().reverse().slice(0, 12).map(p => `<div class="rec"><span>${fmtDate(p.x, {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'})}</span><span class="v">${h.metric === 'seg' ? mmss(p.y) : kgf(p.y)}</span></div>`).join('')}</div>` : ''}`;
}
function recHTML() {
  const used = usedEx(); const by = {};
  used.forEach(id => { const x = exOf(id); (by[x.grupo] = by[x.grupo] || []).push(id); });
  return GROUPS.filter(([g]) => by[g]).map(([g, gn]) => `<h3>${gn}</h3><div class="card" style="padding:0 16px">${by[g].map(id => {
    const x = exOf(id), b = bestFor(id);
    const v = x.tipo === 'pr' ? `${kgf(b.kg)} kg × ${b.kgReps}` : x.tipo === 'r' ? `${b.reps} reps` : mmss(b.seg);
    const sub = x.tipo === 'pr' ? `1RM est. ${kgf(r2(b.e1))} kg` : `${b.n} sesiones`;
    return `<button class="rec" style="width:100%;text-align:left" data-act="h-goprog" data-id="${esc(id)}"><span style="font-weight:600">${esc(x.nombre)}</span><span class="v">${v}</span><span class="s">${b.date ? fmtDate(b.date, {day: 'numeric', month: 'short', year: 'numeric'}) : ''}</span><span class="s" style="text-align:right">${sub}</span></button>`;
  }).join('')}</div>`).join('');
}
function sesDetail(id) {

    <div class="kpis" style="margin-top:12px"><div class="kpi"><b class="num">${durTxt((s.fin || s.inicio) - s.inicio)}</b><span>Duración</span></div><div class="kpi"><b class="num">${sesSets(s)}</b><span>Series</span></div><div class="kpi"><b class="num">${nf0.format(sesVol(s))}</b><span>Volumen (kg)</span></div></div>
    ${feel ? `<p style="margin-top:10px;font-size:14px">Sensación: <b>${s.sensacion} · ${feel}</b></p>` : ''}
    <div class="card" style="margin-top:12px;padding:4px 16px">${s.ejercicios.map(e => { const x = exOf(e.ejId); let n = 0; return `<div class="rec" style="grid-template-columns:1fr"><span style="font-weight:600">${esc(x.nombre)}</span><span class="sesline muted">${e.sets.map(q => { const l = q.tipo === 'C' ? 'C' : ++n; const v = x.tipo === 'pr' ? `${kgf(q.kg)}×${q.reps}` : x.tipo === 'r' ? `${q.reps}` : mmss(q.seg); return `<span${q.pr ? ' style="color:var(--gold);font-weight:700"' : ''}>${l}) ${v}</span>`; }).join(' · ')}</span></div>`; }).join('')}</div>
    ${s.notas ? `<p style="margin-top:12px;font-size:14px;white-space:pre-wrap">${esc(s.notas)}</p>` : ''}

function backupSheet() {

function nxRead() { const n = $('#nx-nombre'), t = $('#nx-instr'); if (n) ui.nx.nombre = n.value; if (t) ui.nx.instr = t.value; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACTIONS[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lib-q') { ui.lib.q = t.value; $('#lib-list').innerHTML = libListHTML(ui.lib.q, ui.lib.grp, 'lib'); }
  else if (t.id === 'pick-q' && pick) { pick.q = t.value; refreshPick(); }

  else if (t.id && t.id.startsWith('ed-peso-') && ui.ed) { const it = ui.ed.ejercicios[+t.dataset.i]; const v = t.value.trim(); const n = parseFloat(v.replace(',', '.')); it.peso = v === '' || isNaN(n) ? null : Math.max(0, r2(n)); const sum = t.closest('.ed-item').querySelector('.sum'); if (sum) sum.textContent = itemSum(it); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'h-ej') { ui.h.ej = t.value; render(); }
  if (t.id === 'imp-file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result); if (!d || !d.estado || !Array.isArray(d.sesiones)) throw new Error('formato');
        confirmSheet('¿Importar esta copia?', `Reemplaza tus datos actuales por la copia: ${(d.estado.rutinas || []).length} rutinas y ${d.sesiones.length} sesiones.`, 'Importar', () => {
          const old = SES.map(s => s.id); S = normState(d.estado); SES = d.sesiones.slice().sort((a, b) => b.inicio - a.inicio);
          const keep = new Set(SES.map(s => s.id)); old.filter(id => !keep.has(id)).forEach(deleteSessionRemote); SES.forEach(saveSession); saveState(); render(); toast('Copia importada');
        });
      } catch (err) { toast('Ese archivo no es una copia válida de Cuaderno de Carga'); }
    };
    fr.readAsText(t.files[0]);
  }
});
